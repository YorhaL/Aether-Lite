# Aether Lite: PostgreSQL + Redis deployment
#
#   cp .env.example .env
#   ./generate_keys.sh
#   docker compose up -d

x-service-logging: &service-logging
  driver: local
  options:
    max-size: "100m"
    max-file: "5"

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: ${DB_NAME:-aether}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    shm_size: ${POSTGRES_SHM_SIZE:-512mb}
    command:
      - postgres
      - -c
      - idle_in_transaction_session_timeout=30000
      - -c
      - tcp_keepalives_idle=30
      - -c
      - tcp_keepalives_interval=10
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.track=all
      - -c
      - pg_stat_statements.max=10000
      - -c
      - shared_buffers=${POSTGRES_SHARED_BUFFERS:-1GB}
      - -c
      - effective_cache_size=${POSTGRES_EFFECTIVE_CACHE_SIZE:-3GB}
      - -c
      - work_mem=${POSTGRES_WORK_MEM:-16MB}
      - -c
      - maintenance_work_mem=${POSTGRES_MAINTENANCE_WORK_MEM:-256MB}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
    logging: *service-logging
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
    command:
      - redis-server
      - --dir
      - /tmp
      - --appendonly
      - "no"
      - --save
      - ""
      - --requirepass
      - ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
      - --maxclients
      - ${REDIS_MAXCLIENTS:-10000}
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$${REDIS_PASSWORD}\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    logging: *service-logging
    restart: unless-stopped

  app:
    image: ${APP_IMAGE:-ghcr.io/yorhal/aether-lite:latest}
    env_file:
      - .env
    environment:
      APP_PORT: ${APP_PORT:-8084}
      TZ: ${TZ:-Asia/Shanghai}
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:?set DB_PASSWORD in .env}@postgres:5432/${DB_NAME:-aether}
      REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}@redis:6379/0
      AETHER_RUNTIME_BACKEND: redis
      AETHER_UPDATE_STRATEGY: docker
      AETHER_DOCKER_UPDATE_COMMAND: ./update.sh
      AETHER_LOG_DESTINATION: stdout
      AETHER_LOG_FORMAT: ${AETHER_LOG_FORMAT:-pretty}
      AETHER_GATEWAY_AUTO_PREPARE_DATABASE: ${AETHER_GATEWAY_AUTO_PREPARE_DATABASE:-true}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8084}:${APP_PORT:-8084}"
    healthcheck:
      test: ["CMD", "/opt/aether/current/bin/aether-gateway", "--healthcheck"]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3
    logging: *service-logging
    restart: unless-stopped
    stop_grace_period: 30s

volumes:
  postgres_data:
