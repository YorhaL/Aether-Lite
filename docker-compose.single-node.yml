# Aether Lite: SQLite single-node deployment
#
#   cp .env.example .env
#   ./generate_keys.sh
#   docker compose -f docker-compose.single-node.yml up -d

services:
  app:
    image: ${APP_IMAGE:-ghcr.io/yorhal/aether-lite:latest}
    env_file:
      - .env
    environment:
      APP_PORT: ${APP_PORT:-8084}
      TZ: ${TZ:-Asia/Shanghai}
      AETHER_DATABASE_DRIVER: sqlite
      AETHER_DATABASE_URL: sqlite:///opt/aether/data/aether.db
      AETHER_RUNTIME_BACKEND: memory
      AETHER_GATEWAY_DEPLOYMENT_TOPOLOGY: single-node
      AETHER_GATEWAY_NODE_ROLE: all
      AETHER_UPDATE_STRATEGY: docker
      AETHER_DOCKER_UPDATE_COMMAND: ./update.sh --mode single-node
      AETHER_LOG_DESTINATION: stdout
      AETHER_LOG_FORMAT: ${AETHER_LOG_FORMAT:-pretty}
      AETHER_GATEWAY_AUTO_PREPARE_DATABASE: ${AETHER_GATEWAY_AUTO_PREPARE_DATABASE:-true}
    ports:
      - "${APP_PORT:-8084}:${APP_PORT:-8084}"
    volumes:
      - ./data:/opt/aether/data
    healthcheck:
      test: ["CMD", "/opt/aether/current/bin/aether-gateway", "--healthcheck"]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3
    logging:
      driver: local
      options:
        max-size: "100m"
        max-file: "5"
    restart: unless-stopped
    stop_grace_period: 30s
